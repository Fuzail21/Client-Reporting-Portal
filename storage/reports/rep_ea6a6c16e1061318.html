<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3-Section Advanced Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="min-h-screen flex items-start justify-center p-6 lg:p-12">
    <section class="w-full max-w-5xl bg-white shadow-lg rounded-2xl p-6 sm:p-10 space-y-10">
      <h1 class="text-3xl font-semibold mb-4">Production Order Form</h1>

      <!-- SECTION 1 -->
      <div class="space-y-6">
        <h2 class="text-xl font-semibold border-b pb-2">Section 1: Order Details</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="block text-sm font-medium">Job #</label><input name="job" type="text" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" required></div>
          <div><label class="block text-sm font-medium">Style #</label><input name="style" type="text" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" required></div>
          <div><label class="block text-sm font-medium">PO Date</label><input name="po_date" type="date" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2"></div>
          <div><label class="block text-sm font-medium">Ship Date</label><input name="ship_date" type="date" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2"></div>
          <div><label class="block text-sm font-medium">Fabrics</label><input name="fabrics" type="text" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2"></div>
          <div><label class="block text-sm font-medium">GSM</label><input name="gsm" type="number" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2"></div>
          <div><label class="block text-sm font-medium">Buyer</label><input name="buyer" type="text" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2"></div>
          <div><label class="block text-sm font-medium">Order Qty</label><input name="order_qty" type="number" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2"></div>
        </div>
        <div>
          <label class="block text-sm font-medium">Upload Image</label>
          <input type="file" name="order_img" accept="image/*" class="mt-2">
        </div>
      </div>

      <!-- SECTION 2 -->
      <div class="space-y-6">
        <h2 class="text-xl font-semibold border-b pb-2">Section 2: Color & Pack</h2>
        <div>
          <label class="block text-sm font-medium">Color</label>
          <input name="color" type="text" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium">Pack</label>
          <input name="pack" type="text" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2" placeholder="Enter pack name">
        </div>
        <div class="border rounded-lg border-slate-100 p-4 bg-slate-50">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-medium">Size Ratios</h3>
            <button type="button" id="addRatioBtn" class="text-sm px-3 py-1.5 rounded-md bg-white border border-slate-200 hover:bg-slate-100">+ Add ratio</button>
          </div>
          <div id="ratiosList" class="mt-3 space-y-2"></div>
        </div>
      </div>

      <!-- SECTION 3 -->
      <div class="space-y-6">
        <h2 class="text-xl font-semibold border-b pb-2">Section 3: Extra Values</h2>
        <div class="border rounded-lg border-slate-100 p-4 bg-slate-50">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-medium">Key/Value with %</h3>
            <button type="button" id="addExtraBtn" class="text-sm px-3 py-1.5 rounded-md bg-white border border-slate-200 hover:bg-slate-100">+ Add</button>
          </div>
          <div id="extraList" class="mt-3 space-y-2"></div>
        </div>
      </div>

      <div class="flex justify-end">
        <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Submit</button>
      </div>
    </section>
  </main>

  <script>
    // Ratio dynamic rows
    const ratiosList = document.getElementById('ratiosList');
    document.getElementById('addRatioBtn').addEventListener('click', ()=>{
      const row = document.createElement('div');
      row.className = 'flex gap-2 items-center';
      row.innerHTML = `
        <input name="ratio_key[]" placeholder="Size" class="rounded-lg border border-slate-200 px-3 py-2 w-32" />
        <input name="ratio_value[]" type="number" placeholder="Qty" class="rounded-lg border border-slate-200 px-3 py-2 w-24" />
        <button type="button" class="remove-row text-red-600">Remove</button>
      `;
      row.querySelector('.remove-row').addEventListener('click', ()=> row.remove());
      ratiosList.appendChild(row);
    });

    // Extra key-value rows
    const extraList = document.getElementById('extraList');
    document.getElementById('addExtraBtn').addEventListener('click', ()=>{
      const row = document.createElement('div');
      row.className = 'flex gap-2 items-center';
      row.innerHTML = `
        <input name="extra_key[]" placeholder="Key" class="rounded-lg border border-slate-200 px-3 py-2 w-40" />
        <input name="extra_value[]" type="number" step="0.1" placeholder="%" class="rounded-lg border border-slate-200 px-3 py-2 w-24" />
        <button type="button" class="remove-row text-red-600">Remove</button>
      `;
      row.querySelector('.remove-row').addEventListener('click', ()=> row.remove());
      extraList.appendChild(row);
    });
  </script>
</body>
</html>
